buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

apply plugin: 'org.spongepowered.mixin'

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

sourceSets {
    storyCompiler
    requester {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
sourceSets.main.runtimeClasspath += sourceSets.requester.output

jarJar.enable()

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                    source sourceSets.requester
                }
            }
        }
        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
        data {
            workingDirectory project.file('run-data')

            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    add sourceSets.requester, "${mod_id}.requester.refmap.json"

    config "${mod_id}.mixins.json"
    config "${mod_id}.merequester.mixins.json"
    config "${mod_id}.requester.mixins.json"
}

// refmap
tasks.named('compileJava', JavaCompile).configure {
    options.incremental = false
    outputs.file(layout.buildDirectory.file("tmp/${name}/${mod_id}.refmap.json"))
}
tasks.named('compileRequesterJava', JavaCompile).configure {
    options.incremental = false
    outputs.file(layout.buildDirectory.file("tmp/${name}/${mod_id}.requester.refmap.json"))
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
    // AE2
    maven {
        name = 'Modmaven'
        url = 'https://modmaven.dev/'
        content {
            includeGroup 'appeng'
            includeGroup 'mezz.jei'
        }
    }
    // ME Requester
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    // JEI
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
        content {
            includeGroup 'mezz.jei'
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Ink
    implementation "com.bladecoder.ink:blade-ink:${ink_version}"
    jarJar(group: 'com.bladecoder.ink', name: 'blade-ink', version: "[${ink_version}]")
    storyCompilerImplementation "com.bladecoder.ink:blade-ink-compiler:${ink_version}"
    storyCompilerImplementation "com.bladecoder.ink:blade-ink:${ink_version}"

    // AE2 and Guide ME
    implementation fg.deobf("appeng:appliedenergistics2-forge:${ae2_version}")
    compileOnly "org.appliedenergistics:guideme:${guideme_version}:api"
    runtimeOnly fg.deobf("org.appliedenergistics:guideme:${guideme_version}")

    // ME Requester
    compileOnly fg.deobf("maven.modrinth:merequester:${merequester_version}")
    // Jade
    compileOnly fg.deobf("maven.modrinth:jade:${jade_version}")
    runtimeOnly fg.deobf("maven.modrinth:jade:${jade_version}")
    // JEI
    compileOnly fg.deobf("mezz.jei:jei-1.20.1-forge:${jei_version}")
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    requesterAnnotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

}

def storyResources = layout.buildDirectory.dir('generated/storyResources')
def compileStories = tasks.register('compileStories', JavaExec) {
    group = 'build'
    description = 'compile and check Ink story'
    classpath = sourceSets.storyCompiler.runtimeClasspath
    mainClass = 'com.murthinext.ae2pr.tools.InkStoryCompiler'
    inputs.dir('src/main/ink')
    inputs.dir('src/main/resources/assets/ae2pr/story/nodes')
    outputs.dir(storyResources)
    args file('src/main/ink').absolutePath, storyResources.get().asFile.absolutePath,
            file('src/main/resources/assets/ae2pr/story/nodes').absolutePath
}
sourceSets.main.resources.srcDir(storyResources)

tasks.named('processResources', ProcessResources).configure {
    dependsOn compileStories
    var replaceProperties = [minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
                             forge_version       : forge_version, forge_version_range: forge_version_range,
                             loader_version_range: loader_version_range,
                             mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
                             mod_authors         : mod_authors, mod_description: mod_description,]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }

    // licenses
    from('LICENSE')
    from('licenses') { into 'META-INF/licenses' }
}

tasks.named('test', Test).configure {
    dependsOn compileStories
    systemProperty 'ae2pr.storyResources', storyResources.get().asFile.absolutePath
}

tasks.named('jarJar').configure {
    archiveClassifier = ''
}
tasks.named('jar', Jar).configure {
    archiveClassifier = 'slim'
}

tasks.withType(Jar).matching { it.name in ['jar', 'jarJar'] }.configureEach {
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1", // We are version 1 of ourselves
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")])
    }
    from sourceSets.requester.output
    // check refmap
    doFirst {
        ['compileJava', 'compileRequesterJava'].each { compileTaskName ->
            def refmap = compileTaskName == 'compileJava' ? "${mod_id}.refmap.json" : "${mod_id}.requester.refmap.json"
            if (!layout.buildDirectory.file("tmp/${compileTaskName}/${refmap}").get().asFile.exists()) {
                throw new GradleException("Mixin refmap lost: ${refmap}")
            }
        }
    }
    finalizedBy name == 'jarJar' ? 'reobfJarJar' : 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}
