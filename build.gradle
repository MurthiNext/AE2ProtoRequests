buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

apply plugin: 'org.spongepowered.mixin'

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

// 独立源码集：ME 红石请求器（含 LGPL-3.0 派生代码，见 src/requester 与 licenses/）
// 目录遵循默认约定：src/requester/java、src/requester/resources
sourceSets {
    requester {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
sourceSets.main.runtimeClasspath += sourceSets.requester.output

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                    source sourceSets.requester
                }
            }
        }
        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
        data {
            workingDirectory project.file('run-data')

            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    add sourceSets.requester, "${mod_id}.requester.refmap.json"

    config "${mod_id}.mixins.json"
    config "${mod_id}.merequester.mixins.json"
    config "${mod_id}.requester.mixins.json"
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // 本地离线依赖（如 JEI / Jade 等编译期依赖；libs/ 已被忽略提交）
    if (file('libs/maven').isDirectory()) {
        maven {
            name = 'LocalLibs'
            url = file('libs/maven').toURI()
            content {
                includeGroup 'mezz.jei'
                includeGroup 'maven.modrinth'
            }
        }
    }
    // AE2 (Applied Energistics 2)
    maven {
        name = 'Modmaven'
        url = 'https://modmaven.dev/'
        content {
            includeGroup 'appeng'
            includeGroup 'mezz.jei'
        }
    }
    // ME Requester (optional compatibility target, compile-only)
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }

    // JEI (optional compatibility target, compile-only)
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
        content {
            includeGroup 'mezz.jei'
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    // AE2 and Guide ME
    implementation fg.deobf("appeng:appliedenergistics2-forge:${ae2_version}")
    compileOnly "org.appliedenergistics:guideme:${guideme_version}:api"
    runtimeOnly fg.deobf("org.appliedenergistics:guideme:${guideme_version}")
    // ME Requester: optional soft-dependency, used only to compile the compatibility mixins.
    compileOnly fg.deobf("maven.modrinth:merequester:${merequester_version}")

    // Jade: optional soft-dependency for tooltip compatibility.
    compileOnly fg.deobf("maven.modrinth:jade:${jade_version}")
    runtimeOnly fg.deobf("maven.modrinth:jade:${jade_version}")

    // JEI: optional soft-dependency for recipe display, compile-only.
    // 离线时从 libs/maven 提供（见 repositories），在线时从 maven 拉取。
    compileOnly fg.deobf("mezz.jei:jei-1.20.1-forge:${jei_version}")
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    // 独立源码集的 mixin 注解处理器
    requesterAnnotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
                             forge_version       : forge_version, forge_version_range: forge_version_range,
                             loader_version_range: loader_version_range,
                             mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
                             mod_authors         : mod_authors, mod_description: mod_description,]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }

    // 许可证与沿用说明随发布 jar 分发
    from('LICENSE')
    from('licenses') { into 'META-INF/licenses' }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1", // We are version 1 of ourselves
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")])
    }
    // 独立源码集产物并入主 jar
    from sourceSets.requester.output
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}
